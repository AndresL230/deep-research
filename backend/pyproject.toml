[project]
name = "deep-research"
version = "0.1.0"
description = "Run a data science agent many times, find the step where its results go wrong, and prove it by forking the VM."
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.38",
    "langchain-anthropic",
    "langchain-daytona>=0.0.9",
    "daytona>=0.231",
    "fastapi",
    "uvicorn[standard]",
    "pandas",
    "scikit-learn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deep_research*"]
