[project]
name = "deep-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.38",
    "fastapi>=0.162.7",
    "langchain-anthropic>=1.7.10",
    "langchain-daytona>=0.0.9",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
