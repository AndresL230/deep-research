[project]
name = "deep-research"
version = "0.1.0"
description = "Run a data science agent many times, find the step where its results go wrong, and prove it by forking the VM."
requires-python = ">=3.12"
dependencies = [
    "daytona>=0.231",
    "deepagents>=0.7.38",
    "fastapi>=0.162.7",
    # The lab page proxy (deep_research/api.py).
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-daytona>=0.0.9",
    # The robot_arm domain scores controllers in the sim on this server (sim/, deep_research/domains/robot_arm.py).
    # Only that domain imports it.
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mujoco==4.0.1",
    "pandas",
    "pylatex>=1.4.2",
    "python-dotenv>=1.2.4",
    "scikit-learn",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    # scripts/make_fixture.py draws the fixture's charts.
    "matplotlib",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deep_research*", "sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
